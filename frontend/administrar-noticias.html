<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar noticias - Municipio Serranoble</title>
    <meta name="municipio-api-base-url" content="">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Css/styles.css">
    <link rel="stylesheet" href="Css/noticias.css">
</head>
<body data-admin-page>
    <header data-site-header></header>

    <main class="container my-4 noticias-page">
        <section class="noticias-intro mb-4">
            <p class="text-uppercase fw-bold mb-2">Panel de administración</p>
            <h1 class="fw-bold mb-2">Administrar noticias</h1>
            <p>Los cambios se guardan en la base de datos municipal.</p>
        </section>

        <section class="admin-noticias-panel mb-5" aria-labelledby="titulo-formulario-noticia">
            <h2 id="titulo-formulario-noticia" class="h3 fw-bold mb-4">Crear una noticia</h2>
            <form id="form-noticia">
                <div class="row g-3">
                    <div class="col-12">
                        <label for="noticia-titulo" class="form-label">Título</label>
                        <input id="noticia-titulo" name="title" class="form-control" maxlength="160" required>
                    </div>
                    <div class="col-md-6">
                        <label for="noticia-categoria" class="form-label">Categoría</label>
                        <select id="noticia-categoria" name="category" class="form-select" required>
                            <option>La Muni Más Cerca</option>
                            <option>Actividades</option>
                            <option>Gestión</option>
                            <option>Comunidad</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="noticia-imagen" class="form-label">Imagen (URL o ruta relativa)</label>
                        <input id="noticia-imagen" name="image" class="form-control" placeholder="assets/imagenes/Logo.jpeg">
                    </div>
                    <div class="col-12">
                        <label for="noticia-resumen" class="form-label">Resumen</label>
                        <textarea id="noticia-resumen" name="summary" class="form-control" rows="2" maxlength="300" required></textarea>
                    </div>
                    <div class="col-12">
                        <label for="noticia-contenido" class="form-label">Contenido (separá los párrafos con una línea en blanco)</label>
                        <textarea id="noticia-contenido" name="content" class="form-control" rows="7" maxlength="15000" required></textarea>
                    </div>
                    <div class="col-12">
                        <label for="noticia-imagen-alt" class="form-label">Descripción accesible de la imagen</label>
                        <input id="noticia-imagen-alt" name="imageAlt" class="form-control" maxlength="180" placeholder="Descripción breve de la imagen">
                    </div>
                    <div class="col-12">
                        <div class="form-check">
                            <input id="noticia-destacada" name="featured" class="form-check-input" type="checkbox">
                            <label for="noticia-destacada" class="form-check-label">Mostrar como noticia principal</label>
                        </div>
                    </div>
                    <div class="col-12 d-flex flex-wrap gap-2">
                        <button id="guardar-noticia" type="submit" class="btn btn-primary">Publicar noticia</button>
                        <button id="cancelar-edicion" type="button" class="btn btn-outline-secondary d-none">Cancelar edición</button>
                    </div>
                </div>
            </form>
            <p id="estado-noticias-admin" class="mt-3 mb-0" role="status" aria-live="polite"></p>
        </section>

        <section aria-labelledby="titulo-listado-admin">
            <h2 id="titulo-listado-admin" class="h3 fw-bold mb-3">Noticias publicadas</h2>
            <div id="listado-admin-noticias" class="admin-noticias-lista"></div>
        </section>
    </main>

    <footer class="bg-dark text-white py-4 mt-auto" data-site-footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/componentes-comunes.js"></script>
    <script src="js/main.js"></script>
    <script src="js/noticias.js"></script>
    <script src="js/admin-noticias.js"></script>
</body>
</html>
