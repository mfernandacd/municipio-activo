<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Reclamos - Municipio Serranoble</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome (Íconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <meta name="municipio-api-base-url" content="">
    <meta name="reclamos-api-base-url" content="">

    <style>
        :root {
            --color-primary: #0C2136;   /* Azul Marino Serranoble */
            --color-secondary: #E6AA38; /* Dorado / Amarillo Trigo */
            --color-bg: #f4f6f9;
        }

        body {
            background-color: var(--color-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background-color: var(--color-primary) !important;
            border-bottom: 3px solid var(--color-secondary);
        }

        .navbar-brand span {
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header-brand {
            background-color: var(--color-primary);
            padding: 12px 0;
            text-align: center;
        }

        @media (max-width: 575.98px) {
            .navbar-brand span {
                font-size: 0.95rem;
            }

            .navbar-brand img {
                height: 52px;
            }
        }

        /* Tarjeta del Formulario */
        .card-custom {
            border: none;
            border-top: 5px solid var(--color-secondary);
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        .btn-serranoble {
            background-color: var(--color-primary);
            color: #ffffff;
            border: 2px solid var(--color-secondary);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-serranoble:hover {
            background-color: var(--color-secondary);
            color: var(--color-primary);
            border-color: var(--color-primary);
        }

        /* Personalización SweetAlert2 */
        .swal2-popup-serranoble {
            border-top: 5px solid var(--color-secondary) !important;
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <img src="assets/imagenes/Logo.jpeg" alt="Municipio Serranoble" class="me-2" height="68">
                    <span>Municipio Serranoble</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarReclamos" aria-controls="navbarReclamos" aria-expanded="false" aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarReclamos">
                    <ul class="navbar-nav ms-auto align-items-lg-center">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="index.html#noticias">Noticias</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle active" href="#" id="reclamosDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" aria-current="page">
                                Reclamos
                            </a>
                            <ul class="dropdown-menu" aria-labelledby="reclamosDropdown">
                                <li><a class="dropdown-item active" href="reclamos-municipal.html" aria-current="page">Nuevo reclamo</a></li>
                                <li><a class="dropdown-item" href="index.html#tramites">Seguimiento</a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-outline-light ms-lg-2" href="login.html" data-auth-link>Iniciar Sesión</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <section class="header-brand mb-4">
        <div class="container text-center">
            <h1 class="h3 text-white m-0">Atención al Ciudadano</h1>
            <p class="text-light small mb-0">Municipio de Serranoble</p>
        </div>
    </section>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <!-- Formulario de Carga -->
                <div class="card card-custom p-4">
                    <h2 class="h4 mb-3 text-center" style="color: var(--color-primary);">
                        <i class="fa-solid fa-pen-to-square me-2"></i>Cargar Nuevo Reclamo
                    </h2>
                    <hr class="mb-4">

                    <form id="formReclamo" enctype="multipart/form-data" novalidate>
                        
                        <!-- Categoría -->
                        <div class="mb-3">
                            <label for="categoria" class="form-label fw-bold">Categoría del Reclamo <span class="text-danger">*</span></label>
                            <select class="form-select" id="categoria" name="categoria" required>
                                <option value="" selected disabled>Seleccione una categoría...</option>
                                <option value="Luminarias">Luminarias</option>
                                <option value="Bacheo">Bacheo</option>
                                <option value="Limpieza">Limpieza</option>
                                <option value="Otros">Otros</option>
                            </select>
                        </div>

                        <!-- Dirección -->
                        <div class="mb-3">
                            <label for="direccion" class="form-label fw-bold">Dirección / Ubicación <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Ej: Av. San Martín 1234, Barrio Centro" required>
                        </div>

                        <!-- Link Google Maps -->
                        <div class="mb-3">
                            <label for="googleMapsUrl" class="form-label fw-bold">Enlace de Google Maps (Opcional)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-location-dot"></i></span>
                                <input type="url" class="form-control" id="googleMapsUrl" name="googleMapsUrl" placeholder="https://maps.google.com/...">
                            </div>
                        </div>

                        <!-- Descripción -->
                        <div class="mb-3">
                            <label for="descripcion" class="form-label fw-bold">Descripción Detallada <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="4" placeholder="Describa la situación del problema (Mínimo 15 caracteres)..." required></textarea>
                            <div class="form-text text-end" id="charCounter">0 caracteres</div>
                        </div>

                        <!-- Carga de Imagen -->
                        <div class="mb-4">
                            <label for="imagen" class="form-label fw-bold">Foto del Reclamo (Opcional)</label>
                            <input class="form-control" type="file" id="imagen" name="imagen" accept="image/jpeg,image/png,image/gif,image/webp">
                        </div>

                        <!-- Botón Enviar -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-serranoble btn-lg">
                                <i class="fa-solid fa-paper-plane me-2"></i>Enviar Reclamo
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/reclamo-validaciones.js"></script>
</body>
</html>
