<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="municipio-api-base-url" content="">
    <title>Registrar un reclamo - Municipio Serranoble</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="Css/styles.css">
    <link rel="stylesheet" href="Css/reclamos-municipal.css">

    <script src="js/reclamo-sesion.js"></script>
</head>
<body class="claim-form-page" data-auth-required>
    <header data-site-header></header>

    <main class="container claim-form-container py-5">
        <div class="claim-form-heading text-center mb-4">
            <p class="dashboard-eyebrow mb-2">Atención ciudadana</p>
            <h1 class="h2 fw-bold text-primary mb-2">Registrar un reclamo</h1>
            <p class="text-muted mb-0">Completá los datos del problema para que el municipio pueda atenderlo.</p>
        </div>

        <section class="card claim-form-card mx-auto" aria-labelledby="claim-form-title">
            <div class="card-body p-4 p-md-5">
                <h2 id="claim-form-title" class="h5 fw-bold mb-4">Datos del reclamo</h2>

                <form id="claimForm" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="userName" class="form-label">Nombre y apellido</label>
                            <input id="userName" class="form-control claim-readonly" type="text" autocomplete="name" readonly required aria-readonly="true">
                            <div class="form-text">Este dato proviene de tu cuenta.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="userEmail" class="form-label">Correo electrónico</label>
                            <input id="userEmail" class="form-control claim-readonly" type="email" autocomplete="email" readonly required aria-readonly="true">
                            <div class="form-text">Este dato proviene de tu cuenta.</div>
                        </div>

                        <div class="col-12">
                            <label for="claimCategory" class="form-label">Categoría <span aria-hidden="true">*</span></label>
                            <select id="claimCategory" name="categoria" class="form-select" required>
                                <option value="" selected disabled>Seleccioná una categoría</option>
                                <option value="Alumbrado y Luminarias Serranas">Alumbrado y luminarias</option>
                                <option value="Mantenimiento de Calles y Asfalto">Calles y asfalto</option>
                                <option value="Poda y Espacios Verdes">Poda y espacios verdes</option>
                                <option value="Recolección e Higiene Urbana">Recolección e higiene urbana</option>
                                <option value="Redes de Agua y Cloacas">Agua y cloacas</option>
                                <option value="Otros">Otros</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="claimAddress" class="form-label">Dirección <span aria-hidden="true">*</span></label>
                            <input id="claimAddress" name="direccion" class="form-control" type="text" maxlength="255" autocomplete="street-address" placeholder="Calle y altura o referencia" required>
                        </div>

                        <!-- ZONA (Se completa automáticamente de forma excluyente según el barrio) -->
                        <div class="col-md-6">
                            <label for="claimZone" class="form-label">Zona <span aria-hidden="true">*</span></label>
                            <select id="claimZone" name="zona" class="form-select" disabled required>
                                <option value="" selected disabled>Se seleccionará automáticamente</option>
                                <option value="NORTE">Norte</option>
                                <option value="SUR">Sur</option>
                                <option value="ESTE">Este</option>
                                <option value="OESTE">Oeste</option>
                                <option value="CENTRO">Centro</option>
                                <option value="RURAL">Rural</option>
                            </select>
                            <div class="form-text">Se asigna automáticamente al elegir el barrio.</div>
                        </div>

                        <!-- BARRIO -->
                        <div class="col-md-6">
                            <label for="claimNeighborhood" class="form-label">Barrio <span aria-hidden="true">*</span></label>
                            <select id="claimNeighborhood" name="barrio" class="form-select" required>
                                <option value="" selected disabled>Seleccioná un barrio</option>
                                <!-- Zona Centro -->
                                <option value="Centro" data-zone="CENTRO">Centro</option>
                                <option value="San Martín" data-zone="CENTRO">San Martín</option>
                                <!-- Zona Norte -->
                                <option value="Villa Belgrano" data-zone="NORTE">Villa Belgrano</option>
                                <!-- Zona Oeste -->
                                <option value="Los Álamos" data-zone="OESTE">Los Álamos</option>
                                <option value="El Mirador" data-zone="OESTE">El Mirador</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="googleMapsUrl" class="form-label">Enlace de Google Maps <span class="text-muted">(opcional)</span></label>
                            <input id="googleMapsUrl" name="googleMapsUrl" class="form-control" type="url" maxlength="500" placeholder="https://maps.google.com/...">
                        </div>

                        <div class="col-12">
                            <label for="claimDescription" class="form-label">Descripción del problema <span aria-hidden="true">*</span></label>
                            <textarea id="claimDescription" name="descripcion" class="form-control" rows="5" minlength="15" maxlength="15000" placeholder="Describí el problema y cuándo ocurre." required></textarea>
                            <div class="form-text">Ingresá al menos 15 caracteres.</div>
                        </div>

                        <div class="col-12 pt-2">
                            <button id="submitBtn" class="btn btn-primary claim-submit-button w-100" type="submit">
                                <i class="fa-solid fa-paper-plane me-2" aria-hidden="true"></i>Enviar reclamo
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer data-site-footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/api.js"></script>
    <script src="js/componentes-comunes.js"></script>
    <script src="js/main.js"></script>
    <script src="js/accesibilidad.js"></script>
    <script src="js/reclamo-validaciones1.js"></script>
</body>
</html>
