<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias - Municipio Serranoble</title>
    <meta name="municipio-api-base-url" content="">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Css/styles.css">
    <link rel="stylesheet" href="Css/noticias.css">
</head>
<body>
    <header data-site-header></header>

    <main class="container my-4 noticias-page">
        <section class="noticias-intro mb-4" aria-labelledby="titulo-noticias">
            <p class="text-uppercase fw-bold mb-2">Municipio Serranoble</p>
            <h1 id="titulo-noticias" class="fw-bold mb-0">Bienvenidos a la sección de noticias</h1>
        </section>

        <section class="home-zone zona-principal mb-5" id="principal" aria-label="Presentación de las noticias">
            <div class="row g-4">
                <div class="col-12">
                    <div class="card card-principal bienvenida-card h-100 shadow-sm overflow-hidden">
                        <img id="noticia-destacada-imagen" src="assets/logo/Logo.jpeg" class="card-img-top" alt="Emblema del municipio de Serranoble">
                        <div class="card-body">
                            <p id="noticia-destacada-titulo" class="card-text fw-bold fs-4">La Municipalidad despliega una agenda semanal con capacitaciones, servicios en terreno y nuevas acciones de fortalecimiento barrial para toda la comunidad.</p>
                        </div>
                        <div class="card-footer bg-transparent border-0 text-end pb-3">
                            <a id="noticia-destacada-enlace" href="noticia-detalle.html?id=agenda-semanal" class="btn btn-success btn-sm px-3">Ampliar</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="noticias" aria-labelledby="titulo-recientes">
            <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
                <div>
                    <p class="noticias-etiqueta mb-1">Actualidad</p>
                    <h2 id="titulo-recientes" class="fw-bold title-section mb-0">Últimas noticias</h2>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <a href="administrar-noticias.html" class="btn btn-primary" data-admin-only hidden>Administrar noticias</a>
                    <a href="index.html" class="btn btn-outline-primary">Volver al inicio</a>
                </div>
            </div>

            <div id="lista-noticias" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" aria-live="polite"></div>
        </section>
    </main>



    <footer data-site-footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/componentes-comunes.js"></script>
    <script src="js/main.js"></script>
    <script src="js/accesibilidad.js"></script>
    <script src="js/noticias.js"></script>
</body>
</html>
