spring.application.name=backend
server.port=8080

# Soporte para proxy inverso en la nube (Render / Nginx / Cloudflare) para HTTPS y puertos
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.datasource.url=jdbc:mysql://${DB_HOST:${MYSQL_ADDON_HOST:localhost}}:${DB_PORT:${MYSQL_ADDON_PORT:3306}}/${DB_NAME:${MYSQL_ADDON_DB:municipio-activo}}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
