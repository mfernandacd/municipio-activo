spring.application.name=backend
server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST:${MYSQL_ADDON_HOST:localhost}}:${DB_PORT:${MYSQL_ADDON_PORT:3306}}/${DB_NAME:${MYSQL_ADDON_DB:municipio-activo}}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=true
spring.datasource.username=${DB_USER:${MYSQL_ADDON_USER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_ADDON_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
