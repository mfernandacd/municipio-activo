spring.application.name=backend
server.port=8080

# Soporte para proxy inverso en la nube (Render / Nginx / Cloudflare) para HTTPS y puertos
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=lax

spring.datasource.url=jdbc:mysql://${DB_HOST:${MYSQL_ADDON_HOST:localhost}}:${DB_PORT:${MYSQL_ADDON_PORT:3306}}/${DB_NAME:${MYSQL_ADDON_DB:municipio-activo}}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=true
spring.datasource.username=${DB_USER:${MYSQL_ADDON_USER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_ADDON_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
