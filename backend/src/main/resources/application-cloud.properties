server.port=${PORT:8080}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax

spring.datasource.url=jdbc:mysql://${DB_HOST:${MYSQL_ADDON_HOST}}:${DB_PORT:${MYSQL_ADDON_PORT:3306}}/${DB_NAME:${MYSQL_ADDON_DB}}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=true
spring.datasource.username=${DB_USER:${MYSQL_ADDON_USER}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_ADDON_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false